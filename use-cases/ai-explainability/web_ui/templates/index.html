<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <span class="brand-mark">X</span>
          <span>AI Explainability </span>
        </a>
        <div class="d-flex align-items-center gap-3">
          <div class="pipeline-status" id="pipelineBadge"></div>
        </div>
      </div>
    </nav>

    <main class="container-xxl app-shell py-4 py-lg-5">
      <header class="workspace-heading mb-4">
        <div>
          <div class="eyebrow">LIVE RUN</div>
          <h1 id="pageTitle">{{ title }}</h1>
          <p id="pageDescription">{{ description }}</p>
        </div>
        <div class="heading-note">
          <span class="pulse-dot"></span>
          Ready
        </div>
      </header>

      <section class="workspace-grid">
        <aside class="input-rail">
          <div class="rail-heading">
            <div>
              <span class="section-kicker">INPUTS</span>
              <h2>Run</h2>
            </div>
          </div>
          <p class="rail-intro">Choose the model and data, then confirm the analysis settings before sending the workflow.</p>
          <form id="workflowForm">
            <div id="fields"></div>
            <div class="form-actions d-flex flex-wrap gap-2 align-items-center">
              <button class="btn btn-primary" id="submitBtn" type="submit"></button>
              <button class="btn btn-outline-secondary" id="resetBtn" type="button">Reset</button>
            </div>
            <div class="alert alert-secondary mt-3 mb-0" id="status" role="status">Loading workflow UI...</div>
          </form>
        </aside>

        <section class="results-stage">
          <div class="results-header">
            <div>
              <span class="section-kicker">OUTPUT</span>
              <h2 id="outputTitle">Workflow output</h2>
            </div>
            <div id="actions" class="d-flex flex-wrap gap-2" hidden></div>
          </div>
          <div id="timeline" class="list-group workflow-timeline mb-3"></div>
          <div id="output" class="vstack gap-3">
            <div class="empty-state">
              <div class="empty-icon">+</div>
              <strong>No result yet.</strong>
              <span>Start a run to see the explanation.</span>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
